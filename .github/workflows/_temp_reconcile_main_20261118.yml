name: Temporary main reconciliation

on:
  push:
    branches:
      - integration/premium-web-reconcile-20261118

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[reconciled-main]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile latest main in isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MathWorld Integration"
          git config user.email "integration@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit -s ort -X ours origin/main -m "chore: reconcile latest main [reconciled-main]"
          test -f 'src/app/[locale]/premium/report/page.tsx'
          test -f 'src/app/[locale]/notifications/page.tsx'
          test -f 'src/components/layout/StudentNotificationsBell.tsx'
          sed -i 's/[[:blank:]]*$//' src/store/api/statsApi.ts
          git add src/store/api/statsApi.ts
          git diff --cached --quiet || git commit -m "chore: remove merged trailing whitespace"
          git diff --check HEAD^1 HEAD
          git push origin HEAD:refs/heads/integration/premium-web-reconcile-20261118
