name: Dependency security audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Temporary PR-only lockfile generation; remove after committing the exact output.
      - name: Resolve candidate lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Record generated lockfile
        run: |
          echo MATHSUPER_LOCKFILE_BEGIN
          base64 -w 120 pnpm-lock.yaml
          echo MATHSUPER_LOCKFILE_END
      - name: Audit locked production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Report all dependency advisories
        if: always()
        run: pnpm audit --audit-level low
