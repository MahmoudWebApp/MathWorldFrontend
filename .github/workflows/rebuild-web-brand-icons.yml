name: Rebuild MathWorld browser and PWA icons on dev

on:
  push:
    branches:
      - feature/premium-entitlements-client
    paths:
      - "tools/rebuild_web_brand_icons.py"
      - ".github/workflows/rebuild-web-brand-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MahmoudWebApp/MathWorldFrontend' && github.ref == 'refs/heads/feature/premium-entitlements-client'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-entitlements-client
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image generator dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Rebuild icons from approved transparent web mark
        run: python tools/rebuild_web_brand_icons.py
      - name: Commit generated assets only to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android-chrome-*.png public/apple-touch-icon.png public/favicon* public/mathworld-favicon* src/app/favicon.ico
          if git diff --cached --quiet; then
            echo "No favicon or PWA changes needed"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(brand): replace black Next.js favicon and PWA icon backgrounds"
          git fetch origin feature/premium-entitlements-client
          git rebase origin/feature/premium-entitlements-client
          git push origin HEAD:feature/premium-entitlements-client
